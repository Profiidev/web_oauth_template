[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-extra",
  "axum-extra-cookie",
  "axum-extra-headers",
  "axum-json",
  "axum-query",
  "axum-tokio",
  "axum-ws",
  "macros"
] }
axum = { version = "0.8.9", features = ["macros", "tracing", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
centaurus = { version = "0.17.0", features = ["uuid"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
entity = { path = "entity" }
figment = { version = "0.10.19", features = ["env"] }
http = "1.5.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
migration = { path = "migration" }
reqwest = { version = "0.13.4", features = ["form", "json"] }
rsa = "0.9.10"
schemars = { version = "1.2.2", features = ["chrono04", "url2", "uuid1"] }
sea-orm = { version = "2.0.1", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite"
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["signal"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }

[features]
test = ["centaurus/test"]

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
reqwest = { version = "=0.13.4", features = ["form", "json"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
rsa = "=0.9.10"
uuid = { version = "=1.24.0", features = ["v4"] }
